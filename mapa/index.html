<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<link rel="icon" type="image/x-icon" href="../assets/favicon.jpg" />
    <meta charset="UTF-8">
    <title>SicoLares - Mapa de Monitoreo</title>
    
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="css/main.css" />
    <link rel="stylesheet" href="../core/toasts.css" />
    <script src="https://unpkg.com/morphdom@2.7.4/dist/morphdom-umd.js"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</head>
<body>
    <!-- Pantalla de Carga -->
    <div id="loading-screen">
        <div class="loader-spinner"></div>
        <p>Iniciando sistema de monitoreo...</p>
    </div>

    <div id="logo-container" class="hud-item stagger-1">
        <img src="../assets/LOGO_SicoLares.png" alt="SicoLares">
    </div>

    <!-- Barra de progreso de actualización de datos -->
    <div id="data-refresh-container" class="hud-item">
        <div id="data-refresh-bar"></div>
    </div>

    <div id="map"></div>
    
    <!-- Información del país actual -->
    <div id="ui-overlay" class="hud-item stagger-1">
        <div class="pais-info" id="pais-info-card">
            <h1 id="pais-nombre"><div class="skeleton" style="width:15vw; height:4vh"></div></h1>
            <p id="stats-info"><div class="skeleton"></div></p>
        </div>
        <div class="legend">
            <div class="legend-item"><span class="dot verde"></span> Operativo</div>
            <div class="legend-item"><span class="dot naranja"></span> Errores Activos</div>
            <div class="legend-item"><span class="dot rojo"></span> Sin Respuesta (>10m)</div>
        </div>
    </div>

    <!-- Temporizador de rotación independiente -->
    <div id="rotation-timer" class="hud-item stagger-2"><div class="skeleton" style="width:10vw; height:3.5vh"></div></div>

    <!-- Controles de navegación de países -->
    <div id="rotation-controls" class="hud-item stagger-3">
        <button id="btn-prev" title="Anterior">◀</button>
        <button id="btn-pause" title="Pausar/Reanudar">⏸</button>
        <button id="btn-next" title="Siguiente">▶</button>
    </div>

    <!-- Contador de cola de alertas -->
    <div id="queue-status-container" class="hud-item stagger-3">
        <div id="queue-status"></div>
    </div>

    <!-- Mapa miniatura para regiones lejanas -->
    <div id="inset-map-container">
        <div id="inset-map"></div>
    </div>

    <!-- Contenedor del Carrusel de Fallos -->
    <div id="failure-feed" class="ticker-viewport">
        <div class="ticker-content" id="failure-feed-wrapper"></div>
    </div>

    <script src="js/main.js" type="module"></script>
</body>
</html>
