; ==============================================================================
; SicoLares - Configuración Centralizada (config.ini)
; ==============================================================================
; Este archivo centraliza todos los parámetros de negocio, tiempos de refresco
; y configuraciones visuales para las aplicaciones de Mapa y Formulario.
;
; REGLA GENERAL DE TIEMPOS:
; - Todos los valores numéricos de tiempo están expresados en milisegundos (ms).
; - Ejemplo: 1000 = 1 segundo | 60000 = 1 minuto | 300000 = 5 minutos.
;
; REGLA DE FORMATO:
; - Para valores complejos (objetos/arrays), se utiliza una cadena JSON simple.
; - Ejemplo: ms_rotacion_paises = '{"724": 300000, "170": 120000}'
; ==============================================================================

[common]
; --- Parámetros Compartidos ---

; Intervalo de actualización de datos global (ms).
; Define cada cuánto tiempo las aplicaciones consultan nuevos estados al servidor.
; Predefinido: 7500 (7.5 segundos)
refresh_interval_ms = 7500

; Umbral de desconexión (minutos).
; Si una máquina no ha enviado señales en este tiempo, se marcará en ROJO (Sin respuesta).
; Predefinido: 10
offline_threshold_minutes = 10

; Endpoint base de la API.
; No cambiar.
; Ruta relativa desde la carpeta de cada proyecto hacia su controlador principal.
; Predefinido: "api/main.php"
api_endpoint = "api/main.php"


[mapa]
; --- Configuración Específica del Mapa de Monitoreo ---

; --- Rotación y Tiempos de Cámara ---
; Tiempo que la cámara permanece en un país antes de saltar al siguiente (ms).
; Predefinido: 300000 (5 minutos)
ms_rotacion_default = 300000

; Tiempos de rotación específicos por país (usar código ISO numérico como string).
; Útil para dar más tiempo de visualización a países con mayor parque de máquinas.
; Predefinido: España(724)=5min, Colombia(170)=2min
ms_rotacion_paises = '{"724": 300000, "170": 120000}'

; Intervalo de cambio de alerta en el carrusel inferior (ms).
; Controla la velocidad a la que rotan los mensajes de error en el HUD.
; (60000 = Muy Lento | 1000 = Muy Rápido)
; Predefinido: 20000 (20 segundos)
velocidad_carrusel = 20000

; Tiempo de espera tras interacción del usuario (ms).
; Si el usuario mueve el mapa manualmente, el sistema esperará este tiempo antes
; de retomar la rotación automática. Usar -1 para desactivar la vuelta automática.
; Predefinido: 30000 (30 segundos)
inactivo = 30000

; --- Filtro Horario del Mapa ---
; Controla el tono visual del mapa según la hora del día.
; Modos: 'auto' (según hora), 'mañana', 'mediodia', 'tarde', 'noche', 'desactivado'
filtro_horario_modo = "auto"
; Umbrales horarios para el modo 'auto' (Hora de inicio de cada fase)
filtro_horario_mañana = 6
filtro_horario_mediodia = 11
filtro_horario_tarde = 17
filtro_horario_noche = 21

; --- Niveles de Zoom ---
; Zoom inicial por defecto para países no especificados.
; Predefinido: 6.5
zoom_default = 6.5

; Ajustes finos de zoom por país para encuadrar correctamente sus fronteras.
; Predefinido: España(724)=6.7, Colombia(170)=6.5
zoom_paises = '{"724": 6.7, "170": 6.5}'

; --- Lógica de Notificaciones ---
; Umbral de "Alerta Reciente" (ms).
; Las alertas ocurridas hace menos de este tiempo tendrán un brillo/pulso especial.
; Predefinido: 120000 (2 minutos)
recent_threshold_ms = 120000

; Tamaño del buffer para el scroll infinito de la lista de alertas.
; Cantidad de elementos duplicados al final para asegurar un desplazamiento suave.
; Predefinido: 10
loop_buffer_size = 10

; --- Configuración de Audio (Sintetizador) ---
; Volumen maestro de las alertas sonoras (0.0 a 1.0).
; Predefinido: 0.5
sounds_volume = 0.5

; Configuración para alertas de estado CRÍTICO (ROJO).
; Formato JSON: {"freq": Hercios, "type": "tipo_onda", "duration": SEGUNDOS}
; Ondas válidas: 'sine', 'square', 'sawtooth', 'triangle'
sounds_rojo = '{"freq": 150, "type": "sawtooth", "duration": 0.5}'

; Configuración para alertas de ADVERTENCIA (NARANJA).
sounds_naranja = '{"freq": 880, "type": "sine", "duration": 0.5}'

; --- Vistas Secundarias (Insets) ---
; Define regiones remotas que se muestran en pequeños mapas superpuestos (como Canarias).
; center: [lat, lng], zoom: nivel, label: etiqueta visible.
inset_views = '{"724": {"center": [28.4, -16.0], "zoom": 6.3, "label": "Canarias"}}'

; --- Proveedores de Mapas (Tiles) ---
; URLs de los servidores de mapas y atribuciones legales.
; Se recomienda no cambiar estas opciones.
map_tiles = "https://tiles.stadiamaps.com/tiles/stamen_terrain_background/{z}/{x}/{y}{r}.{ext}"
terrain_lines = "https://tiles.stadiamaps.com/tiles/stamen_terrain_lines/{z}/{x}/{y}{r}.{ext}"
attribution = '&copy; <a href="https://www.sicolares.com/" target="_blank">SicoLares</a> &copy; <a href="https://www.stadiamaps.com/" target="_blank">Stadia Maps</a>'


[formulario]
; --- Configuración Específica del Formulario de Gestión ---

; Tiempo de espera para ejecutar la búsqueda mientras el usuario escribe (ms).
; Evita colapsar el servidor con peticiones en cada pulsación de tecla.
; Predefinido: 250
debounce_ms = 250

; Tiempo de espera para recalcular dimensiones tras cambiar el tamaño de ventana (ms).
; Predefinido: 200
resize_debounce_ms = 200

; --- Modo Presentación (Pantalla Completa) ---
; Se cuentan las maquinas totales en pantalla, no por columna.
; Líneas máximas de máquinas por pantalla si falla el cálculo dinámico.
presentation_default_max_lines = 20
; Límite mínimo de seguridad de filas a renderizar.
presentation_min_lines_limit = 24
; Cantidad de errores que rotan simultáneamente en el pie de página.
presentation_errors_per_page = 8
; Margen de seguridad (px) para el cálculo de altura disponible.
presentation_safety_margin_px = 30

; --- Comportamiento de la Interfaz (UI) ---
; Máximo de filas que ejecutan animación de entrada en cascada (rendimiento).
ui_table_animation_limit = 50
; Retraso incremental (segundos) entre cada fila al aparecer.
ui_table_animation_delay_step = 0.03
; Píxeles de scroll necesarios para mostrar el botón "Volver arriba".
ui_back_to_top_threshold_px = 200

; --- Animación de Contadores (KPIs) ---
; Estas variables controlan la velocidad de la cuenta animada de los números superiores.
; Duración base para cambios pequeños (ms).
kpi_base_duration_small_delta = 1000
; Tiempo máximo absoluto que puede durar una animación (ms).
kpi_max_duration = 4000
; Duración base para cambios grandes (ms).
kpi_base_duration_large_delta = 2500
; Factor de escala (máquinas) para alcanzar la duración máxima.
kpi_delta_calc_factor = 250

; --- Ejemplos de Configuración de Animación ---
; Configuración 1 (Equilibrada - Actual):
; kpi_base_duration_small_delta = 1000, kpi_max_duration = 4000, kpi_base_duration_large_delta = 2500, kpi_delta_calc_factor = 250
; -> 10 maq: 2.5s | 50 maq: 2.8s | 100 maq: 3.1s | 200 maq: 3.7s
;
; Configuración 2 (Rápida/Agresiva):
; kpi_base_duration_small_delta = 500, kpi_max_duration = 2000, kpi_base_duration_large_delta = 1000, kpi_delta_calc_factor = 100
; -> 10 maq: 1.1s | 50 maq: 1.5s | 100 maq: 2.0s | 200 maq: 2.0s (Max)
;
; Configuración 3 (Lenta/Cinemática):
; kpi_base_duration_small_delta = 2000, kpi_max_duration = 8000, kpi_base_duration_large_delta = 4000, kpi_delta_calc_factor = 500
; -> 10 maq: 4.1s | 50 maq: 4.4s | 100 maq: 4.8s | 200 maq: 5.6s
